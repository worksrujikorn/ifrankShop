<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#11111a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>iFrank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Playfair+Display:wght@700;900&family=Space+Grotesk:wght@500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    /* Theme colours come from assets/shared.js → THEMES (CSS variables) */
    :root {
      --grad: linear-gradient(135deg, var(--accent), var(--accent2));
      --body: 'Plus Jakarta Sans', 'Anuphan', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --tabh: 64px;
      --safe: env(safe-area-inset-bottom);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      background: var(--bgfx), var(--bg); background-attachment: fixed;
      color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.5;
      min-height: 100vh; -webkit-tap-highlight-color: transparent;
      padding-bottom: calc(var(--tabh) + var(--safe) + 96px);
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .app { max-width: 560px; margin: 0 auto; }
    .pad { padding: 0 16px; }
    .hidden { display: none !important; }
    .num { font-variant-numeric: tabular-nums; }

    /* ---------- ANNOUNCEMENT ---------- */
    .announce { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 28%, var(--bg)), color-mix(in srgb, var(--accent2) 18%, var(--bg))); font-size: 12px; }
    .announce .age-pill { flex-shrink: 0; background: var(--accent); color: var(--on); font-weight: 800; font-size: 10px; padding: 3px 8px; border-radius: 6px; letter-spacing: .5px; }
    .announce .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .announce button { color: var(--muted); font-size: 16px; padding: 0 4px; }

    /* ---------- TOP BAR ---------- */
    .topbar { position: sticky; top: 0; z-index: 30; background: var(--barbg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .topbar-in { display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
    .sq { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line2); background: var(--card); display: grid; place-items: center; position: relative; color: var(--text); }
    .sq .cnt { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--on); font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
    .sq .cnt.bump { animation: bump .4s; }
    @keyframes bump { 40% { transform: scale(1.35); } }
    .theme-pill { margin: 0 auto; display: flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); font-size: 13px; font-weight: 600; }
    .theme-pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 10px var(--glow); }
    .searchbar { padding: 0 16px 12px; display: flex; gap: 8px; }
    .searchbar input { flex: 1; height: 42px; border-radius: 14px; border: 1px solid var(--line2); background: var(--input); color: var(--text); padding: 0 14px; font: inherit; outline: none; }
    .searchbar input:focus { border-color: var(--accent); }

    /* ---------- HERO ---------- */
    .hero { text-align: center; padding: 30px 16px 6px; }
    .brand { font-family: var(--fontd); font-size: var(--brandsize); font-weight: var(--brandw); letter-spacing: var(--brandls); text-transform: var(--brandcase); line-height: 1.05; background: var(--brandgrad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .tagline { margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: 3.5px; text-transform: uppercase; color: var(--muted); }
    .service { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); font-size: 12.5px; font-weight: 500; max-width: 100%; }

    /* ---------- CHIPS ---------- */
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 18px 16px 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; white-space: nowrap; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; transition: all .15s; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on); box-shadow: 0 6px 18px var(--glow); }
    .filterbar { margin: 12px 16px 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; border: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); font-size: 13px; }
    .filterbar span { flex: 1; }
    .filterbar button { color: var(--accent); font-weight: 700; }

    /* ---------- SECTION ---------- */
    .section { margin-top: 26px; }
    .sec-head { display: flex; align-items: center; gap: 9px; padding: 0 16px; }
    .sec-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .sec-name { font-family: var(--fontd); font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    .sec-count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--dim); white-space: nowrap; }
    .sec-sub { padding: 2px 16px 0 34px; font-size: 12px; color: var(--dim); }

    /* ---------- PRODUCT CARD ---------- */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px 0; }
    .card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 14px; transition: transform .15s, border-color .2s; cursor: pointer; }
    .card:active { transform: scale(.98); }
    .card-top { width: 100%; min-height: 22px; display: flex; justify-content: center; gap: 4px; }
    .card-top.two { justify-content: space-between; }
    .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; letter-spacing: .2px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.3; }
    .card .emoji { font-size: 38px; line-height: 1; margin: 16px 0 12px; letter-spacing: 4px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
    .card .name { font-family: var(--fontd); font-size: 16.5px; font-weight: 700; line-height: 1.2; letter-spacing: -.2px; }
    .card .type { margin-top: 4px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--c1); }
    .sizes { display: flex; gap: 5px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .size { min-width: 32px; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; color: var(--dim); background: var(--input); border: 1px solid var(--line); }
    .size.on { background: var(--c1); color: var(--ct); border-color: var(--c1); }
    .card .price { margin-top: 8px; font-family: var(--fontd); font-size: 19px; font-weight: 800; }
    .card .price small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 2px; }
    .add { margin-top: 10px; width: 100%; height: 40px; border-radius: 12px; background: var(--c1); color: var(--ct); font-weight: 800; font-size: 13px; white-space: nowrap; box-shadow: 0 6px 16px color-mix(in srgb, var(--c1) 30%, transparent); transition: transform .1s; }
    .add:active { transform: scale(.95); }
    .card.sold { cursor: default; }
    .card.sold .emoji, .card.sold .name, .card.sold .type, .card.sold .sizes, .card.sold .price { opacity: .3; filter: grayscale(1); }
    .card.sold .add { background: var(--btnoff); color: var(--dim); box-shadow: none; cursor: not-allowed; }
    .sold-pill { background: var(--line2); color: var(--muted); }
    @media (min-width: 560px) { .grid { gap: 14px; } }

    .empty { text-align: center; color: var(--dim); padding: 50px 24px; font-size: 13px; }

    /* ---------- FOOTER ---------- */
    .footer { margin: 40px 16px 0; padding-top: 26px; border-top: 1px solid var(--line); text-align: center; }
    .footer-brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--fontd); font-weight: 700; font-size: 16px; }
    .footer-brand span { font-family: var(--body); font-size: 10px; font-weight: 700; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); padding: 2px 8px; border-radius: 999px; }
    .footer-about { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 12px; color: var(--muted); }
    .footer-links button { text-decoration: underline; text-underline-offset: 3px; }
    .legal { display: flex; gap: 10px; text-align: left; margin-top: 18px; padding: 12px 14px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); background: color-mix(in srgb, var(--amber) 7%, transparent); font-size: 11.5px; color: var(--muted); }
    .legal b { color: var(--amber); display: block; margin-bottom: 2px; font-size: 12px; }
    .copy { margin-top: 16px; font-size: 11px; color: var(--dim); }

    /* ---------- CART BAR + TAB BAR ---------- */
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; pointer-events: none; }
    .dock > * { pointer-events: auto; }
    .cartbar { max-width: 528px; margin: 0 auto 10px; width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 10px; border-radius: 20px; background: var(--card); border: 1.5px solid var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent), 0 14px 40px rgba(0,0,0,.45); transform: translateY(160%); transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
    .cartbar.show { transform: none; }
    .cartbar .n { width: 38px; height: 38px; border-radius: 12px; background: var(--grad); color: var(--on); display: grid; place-items: center; font-weight: 800; }
    .cartbar .t { flex: 1; min-width: 0; line-height: 1.2; }
    .cartbar .t small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .cartbar .t b { font-family: var(--fontd); font-size: 19px; }
    .cartbar .go { height: 44px; padding: 0 16px; border-radius: 14px; background: var(--accent); color: var(--on); font-weight: 800; font-size: 13.5px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .tabbar { background: var(--barbg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: var(--safe); }
    .tabs { max-width: 560px; margin: 0 auto; height: var(--tabh); display: grid; grid-template-columns: repeat(4, 1fr); }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--dim); font-size: 11px; font-weight: 600; white-space: nowrap; position: relative; }
    .tab.on { color: var(--accent); }
    .tab.on::before { content: ''; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
    .tab .dot { position: absolute; top: 9px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

    /* ---------- SHEETS ---------- */
    .overlay { position: fixed; inset: 0; z-index: 60; background: var(--overlay); display: none; align-items: flex-end; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--sheet); border: 1px solid var(--line2); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 12px 20px calc(24px + var(--safe)); animation: up .3s cubic-bezier(.2,.9,.3,1.05); }
    @keyframes up { from { transform: translateY(100%); } }
    .handle { width: 40px; height: 5px; border-radius: 3px; background: var(--line2); margin: 0 auto 16px; }
    .overlay.left { justify-content: flex-start; align-items: stretch; }
    .drawer { width: min(320px, 86vw); background: var(--sheet); border-right: 1px solid var(--line2); padding: 22px 16px; animation: slide .25s ease; overflow-y: auto; }
    @keyframes slide { from { transform: translateX(-100%); } }
    .drawer .brand { font-size: 34px; text-align: left; }
    .drawer-list { margin-top: 20px; display: flex; flex-direction: column; gap: 4px; }
    .drawer-list button { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; border-radius: 12px; font-weight: 600; }
    .drawer-list button:hover { background: var(--card); }
    .drawer-list hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

    /* product sheet */
    .p-top { display: flex; gap: 14px; align-items: center; }
    .p-emoji { width: 78px; height: 78px; flex-shrink: 0; border-radius: var(--radius); background: color-mix(in srgb, var(--c1) 12%, var(--input)); border: 1px solid color-mix(in srgb, var(--c1) 35%, var(--line)); display: grid; place-items: center; font-size: 38px; }
    .p-name { font-family: var(--fontd); font-size: 24px; font-weight: 800; line-height: 1.15; }
    .p-type { margin-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--c1); }
    .p-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .rule { height: 1px; background: var(--line); margin: 16px 0; }
    .row { display: flex; gap: 12px; margin-bottom: 9px; font-size: 13.5px; }
    .row .l { min-width: 62px; color: var(--dim); font-size: 12px; font-weight: 700; padding-top: 1px; }
    .row .v { color: var(--muted); }
    .row .feel { color: var(--soft); font-weight: 600; }
    .terp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .tchip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--input); border: 1px solid var(--line2); }
    .tchip b { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
    .mini-radar { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: center; margin-top: 12px; padding: 12px; border-radius: 16px; background: var(--input); border: 1px solid var(--line); }
    .mini-radar .radar { width: 130px; height: 130px; }
    .mini-radar ul { list-style: none; font-size: 12px; display: grid; gap: 4px; }
    .mini-radar li { display: flex; justify-content: space-between; color: var(--muted); }
    .mini-radar li b { font-family: var(--mono); font-size: 11px; color: var(--text); }
    .opt { margin: 18px 0 8px; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
    .tiers { display: flex; gap: 8px; }
    .tier { flex: 1; padding: 10px 6px; border-radius: 14px; background: var(--input); border: 1.5px solid var(--line2); text-align: center; }
    .tier small { display: block; font-size: 11px; font-weight: 800; color: var(--dim); }
    .tier b { font-family: var(--fontd); font-size: 17px; }
    .tier.on { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 12%, var(--input)); }
    .buy { display: flex; gap: 10px; margin-top: 18px; }
    .stepper { display: flex; align-items: center; border-radius: 14px; border: 1.5px solid var(--line2); background: var(--input); }
    .stepper button { width: 42px; height: 50px; font-size: 20px; font-weight: 700; color: var(--accent); }
    .stepper span { min-width: 26px; text-align: center; font-weight: 800; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 14px; font-weight: 800; font-size: 14.5px; white-space: nowrap; }
    .btn-main { flex: 1; background: var(--accent); color: var(--on); box-shadow: 0 8px 22px var(--glow); }
    .btn-main:disabled { background: var(--btnoff); color: var(--dim); box-shadow: none; cursor: not-allowed; }
    .btn-mint { background: var(--mint); color: var(--bg); box-shadow: 0 8px 22px color-mix(in srgb, var(--mint) 30%, transparent); }
    .btn-ghost { background: var(--card); border: 1px solid var(--line2); color: var(--text); }
    .btn-block { width: 100%; }
    .stack { display: flex; flex-direction: column; gap: 10px; }

    /* cart sheet */
    .cart-head { display: flex; justify-content: space-between; align-items: center; }
    .h2 { font-family: var(--fontd); font-size: 24px; font-weight: 800; letter-spacing: -.3px; }
    .link { color: var(--dim); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }
    .ci { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px dashed var(--line2); }
    .ci-e { width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: var(--input); display: grid; place-items: center; font-size: 24px; }
    .ci-m { flex: 1; min-width: 0; }
    .ci-n { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ci-s { font-size: 12px; color: var(--dim); }
    .ci-s .so { color: var(--red); font-weight: 700; }
    .ci .stepper button { width: 32px; height: 34px; font-size: 16px; }
    .ci .stepper span { min-width: 18px; font-size: 13px; }
    .ci-p { min-width: 54px; text-align: right; font-weight: 800; font-family: var(--fontd); }
    textarea.note { width: 100%; margin-top: 14px; min-height: 64px; resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line2); background: var(--input); color: var(--text); font: inherit; font-size: 13.5px; outline: none; }
    textarea.note:focus { border-color: var(--accent); }
    textarea.note::placeholder { color: var(--dim); }
    .sum { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 6px; }
    .sum span { color: var(--muted); }
    .sum b { font-family: var(--fontd); font-size: 30px; font-weight: 800; }
    .small { font-size: 12px; color: var(--dim); line-height: 1.6; }

    /* ---------- LAB ---------- */
    .lab-hero { margin: 18px 16px 0; padding: 18px; border-radius: 24px; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 14%, var(--card)), var(--card) 60%); border: 1px solid var(--line2); }
    .live { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .8px; color: var(--mint); background: color-mix(in srgb, var(--mint) 12%, transparent); border: 1px solid color-mix(in srgb, var(--mint) 35%, transparent); }
    .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 8px var(--mint); }
    .lab-title { margin-top: 12px; font-family: var(--fontd); font-size: 28px; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; }
    .lab-title em { font-style: normal; color: var(--mint); }
    .lab-sub { margin-top: 6px; font-size: 13px; color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .stat { padding: 12px 6px; border-radius: 16px; background: var(--input); border: 1px solid var(--line); text-align: center; }
    .stat .ic { font-size: 18px; }
    .stat b { display: block; margin-top: 4px; font-family: var(--fontd); font-size: 20px; font-weight: 800; }
    .stat small { font-size: 10.5px; color: var(--dim); font-weight: 600; }
    .h3row { display: flex; align-items: baseline; gap: 8px; padding: 22px 16px 0; }
    .h3 { font-family: var(--fontd); font-size: 18px; font-weight: 700; }
    .h3row small { margin-left: auto; font-size: 11.5px; color: var(--dim); white-space: nowrap; }
    .panel { margin: 12px 16px 0; padding: 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); }
    .panel-head { display: flex; align-items: center; gap: 8px; }
    .panel-head .h3 { flex: 1; }
    .pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .pill-mint { color: var(--mint); border: 1px solid color-mix(in srgb, var(--mint) 40%, transparent); background: color-mix(in srgb, var(--mint) 10%, transparent); }
    .radar-wrap { display: flex; justify-content: center; margin-top: 4px; }
    .radar-wrap .radar { width: 100%; max-width: 330px; }
    .radar-label { font-size: 13px; font-weight: 700; fill: var(--muted); font-family: var(--body); }
    .radar-pct { fill: var(--dim); font-weight: 600; }
    .radar-shape { transform-origin: center; transform-box: fill-box; animation: pop .45s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    .radar-foot { text-align: center; font-size: 11.5px; color: var(--dim); margin-top: 2px; }
    .tcard { margin: 12px 16px 0; padding: 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); }
    .tc-top { display: flex; gap: 12px; align-items: flex-start; }
    .tc-ic { width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: color-mix(in srgb, var(--tc) 14%, var(--input)); border: 1px solid color-mix(in srgb, var(--tc) 35%, var(--line)); }
    .tc-main { flex: 1; min-width: 0; }
    .tc-name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: var(--fontd); font-size: 18px; font-weight: 700; }
    .tc-mood { font-family: var(--body); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, transparent); border: 1px solid color-mix(in srgb, var(--tc) 35%, transparent); }
    .tc-aroma { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .tc-pct { text-align: right; }
    .tc-pct b { font-family: var(--fontd); font-size: 22px; font-weight: 800; color: var(--tc); }
    .tc-pct small { display: block; font-size: 10px; color: var(--dim); white-space: nowrap; }
    .bar { height: 6px; border-radius: 3px; background: var(--input); margin: 12px 0; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 3px; background: var(--tc); }
    .tc-desc { font-size: 13px; color: var(--muted); }
    .tc-rec { margin-top: 12px; font-size: 11.5px; color: var(--dim); font-weight: 600; }
    .tc-foot { display: flex; align-items: flex-end; gap: 8px; margin-top: 6px; }
    .tc-foot .terp-chips { flex: 1; }
    .tc-foot .tchip { cursor: pointer; }
    .pick { flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--accent); color: var(--on); font-weight: 800; font-size: 12.5px; white-space: nowrap; }
    .info-card { display: flex; gap: 12px; margin: 12px 16px 0; padding: 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); }
    .info-card .ic { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; background: var(--input); font-size: 20px; }
    .info-card b { font-family: var(--fontd); font-size: 15.5px; display: block; }
    .info-card p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .combo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .combo div { padding: 12px 10px; border-radius: 16px; background: var(--input); border: 1px solid var(--line); text-align: center; }
    .combo .e { font-size: 20px; }
    .combo b { display: block; font-family: var(--fontd); font-size: 14px; margin-top: 4px; }
    .combo small { font-size: 11.5px; color: var(--dim); }

    /* ---------- ORDER SLIP ---------- */
    .step-card { display: flex; gap: 12px; align-items: center; margin: 18px 16px 0; padding: 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
    .step-card .ic { width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, var(--input)); font-size: 20px; }
    .step-card b { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .step-card b i { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); }
    .step-card p { font-size: 12.5px; color: var(--muted); }
    .snap-hint { margin: 14px 16px 0; padding: 9px 14px; border-radius: 12px; font-size: 12.5px; font-weight: 600; text-align: center; color: var(--text); background: color-mix(in srgb, var(--accent) 14%, var(--card)); border: 1px dashed var(--accent); }
    .slip { margin: 10px 16px 0; border-radius: 22px; background: var(--card); border: 1px solid var(--line2); overflow: hidden; position: relative; }
    .slip-stripe { height: 5px; background: linear-gradient(90deg, var(--accent), var(--mint), var(--amber)); }
    .slip-in { padding: 14px 16px 12px; }
    .slip-top { display: flex; align-items: center; gap: 8px; }
    .slip-top .lab { flex: 1; font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; color: var(--mint); }
    .status { font-family: var(--mono); font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--input); border: 1px solid var(--line2); white-space: nowrap; }
    .status.ok { color: var(--mint); }
    .status.wait { color: var(--amber); }
    .slip-title { margin-top: 2px; font-family: var(--fontd); font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
    .meta { margin-top: 10px; padding: 9px 12px; border-radius: 12px; background: var(--input); display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; }
    
    .meta b { font-family: var(--mono); font-weight: 600; color: var(--text); text-align: right; }
    .meta b.id { color: var(--accent); }
    .lhead { display: flex; justify-content: space-between; margin: 10px 2px 5px; font-size: 11px; font-weight: 700; color: var(--dim); }
    .li { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 14px; background: color-mix(in srgb, var(--input) 60%, transparent); margin-bottom: 6px; }
    .li-e { width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; display: grid; place-items: center; background: var(--input); font-size: 18px; }
    .li-m { flex: 1; min-width: 0; }
    .li-n { font-family: var(--fontd); font-size: 15px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .li-t { display: flex; gap: 5px; margin-top: 2px; }
    .li-t span { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--soft); }
    .li-t span.sz { background: color-mix(in srgb, var(--mint) 14%, transparent); color: var(--mint); }
    .li-p { font-family: var(--mono); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .perf { position: relative; height: 18px; margin: 4px -16px; }
    .perf::before { content: ''; position: absolute; left: 16px; right: 16px; top: 50%; border-top: 2px dashed var(--line2); }
    .perf::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 0 50%, var(--bg) 10px, transparent 11px), radial-gradient(circle at 100% 50%, var(--bg) 10px, transparent 11px); }
    .total-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .total-row small { display: block; font-size: 11px; color: var(--dim); font-weight: 700; }

    .total-row b span { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 4px; letter-spacing: 0; }
    .count-pill { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; color: var(--mint); background: color-mix(in srgb, var(--mint) 10%, transparent); border: 1px solid color-mix(in srgb, var(--mint) 35%, transparent); white-space: nowrap; }
    .slip-note { margin-top: 8px; padding: 8px 12px; border-radius: 12px; background: var(--input); font-size: 12.5px; color: var(--muted); }
    .slip-hint { display: flex; gap: 10px; align-items: center; margin-top: 12px; padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 10%, var(--input)); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-size: 12.5px; font-weight: 600; }
    .slip-foot { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 10px; font-family: var(--mono); font-size: 10px; color: var(--dim); line-height: 1.5; }
    .barcode { display: flex; gap: 1.5px; height: 26px; align-items: stretch; }
    .barcode i { background: var(--muted); border-radius: 1px; }
    .slip.compact .li { padding: 5px 8px; margin-bottom: 4px; }
    .slip.compact .li-t { display: none; }
    .slip.compact .li-e { width: 30px; height: 30px; font-size: 15px; }
    .slip.compact .li-n { font-size: 13.5px; }
    .slip-actions { margin: 14px 16px 0; }
    .hist { margin: 12px 16px 0; }
    .hist button.h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-bottom: 8px; text-align: left; }
    .hist .h.on { border-color: var(--accent); }
    .hist .h b { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
    .hist .h small { display: block; font-size: 11.5px; color: var(--dim); }
    .hist .h .amt { margin-left: auto; font-family: var(--fontd); font-weight: 800; font-size: 16px; }

    /* ---------- SETTINGS ---------- */
    .set-title { padding: 24px 16px 0; }
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .theme-opt { border: 2px solid var(--line); border-radius: 24px; padding: 5px; text-align: left; background: var(--card); }
    .theme-opt.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
    .theme-opt .nm { display: flex; align-items: center; gap: 6px; padding: 8px 6px 4px; font-weight: 700; font-size: 12.5px; }
    .theme-opt .nm span { margin-left: auto; font-size: 10px; font-weight: 800; color: var(--accent); }
    .steps { display: grid; gap: 10px; margin-top: 12px; }
    .stp { display: flex; gap: 12px; align-items: center; }
    .stp i { font-style: normal; width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on); font-weight: 800; font-family: var(--fontd); }
    .stp div { font-size: 13px; color: var(--muted); }
    .stp b { display: block; color: var(--text); }

    /* ---------- AGE GATE / TOAST ---------- */
    .age { position: fixed; inset: 0; z-index: 100; background: var(--bgfx), var(--bg); display: none; align-items: center; justify-content: center; padding: 24px; }
    .age.open { display: flex; }
    .age-box { width: 100%; max-width: 340px; text-align: center; }
    .age-badge { display: inline-block; margin-top: 22px; font-size: 13px; font-weight: 800; padding: 5px 14px; border-radius: 999px; background: var(--accent); color: var(--on); }
    .age-q { margin-top: 14px; font-family: var(--fontd); font-size: 22px; font-weight: 700; }
    .age-s { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
    .toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -160%); z-index: 200; max-width: calc(100% - 32px); padding: 11px 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--accent); color: var(--text); font-weight: 600; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: transform .3s cubic-bezier(.2,.9,.3,1.2); text-align: center; }
    .toast.show { transform: translate(-50%, 0); }
    .preview-bar { background: #000; color: #fff; text-align: center; font-size: 12px; padding: 7px; }
    .preview-bar a { color: var(--accent); font-weight: 800; margin-left: 8px; }
    .skeleton { height: 280px; border-radius: var(--radius); background: linear-gradient(90deg, var(--card), var(--card2), var(--card)); background-size: 200% 100%; animation: sk 1.2s infinite; }
    @keyframes sk { to { background-position: -200% 0; } }
  </style>
</head>

      <div class="stack" id="ageBtns" style="margin-top:22px">

  <script src="/assets/shared.js"></script>
  <script>
    const I = IFRANK;
    const { fmt, esc, flavor, onColor, badgeHTML, priceSummary, store, THEMES, TERPENES, MOODS, PROFILE_AXES } = I;
    const $ = (id) => document.getElementById(id);

    /* ================= STATE ================= */
    let DB = null;
    let view = 'shop';
    let cat = 'all';
    let query = '';
    let terpFilter = null;                 // terpene key from the Lab
    let mood = 'all';
    const selTier = {};                    // productId → tier index on the card
    let sheet = null;                      // product sheet state
    let cart = store.get('ifrank_cart', []);            // [{id,label,qty}]
    let orders = store.get('ifrank_orders', []);        // newest first
    let currentOrderId = orders[0]?.id || null;

    /* ================= THEME ================= */
    const urlTheme = new URLSearchParams(location.search).get('theme');
    const PREVIEW = THEMES[urlTheme] ? urlTheme : null;
    const activeTheme = () => PREVIEW || store.get('ifrank_my_theme', null) || I.themeKey(DB?.settings?.theme || store.get('ifrank_shop_theme', I.DEFAULT_THEME));
    function setTheme() {
      const k = I.themeKey(activeTheme());
      I.applyTheme(k);
      $('themeName').textContent = THEMES[k].name;
    }
    setTheme();
    if (PREVIEW) document.body.insertAdjacentHTML('afterbegin', `<div class="preview-bar">👀 ตัวอย่างธีม ${esc(THEMES[PREVIEW].name)}<a href="/">✕ ปิด</a></div>`);

    /* ================= BOOT ================= */
    init();
    async function init() {
      try { DB = (await I.loadData()).data; }
      catch (e) { $('shopList').innerHTML = '<div class="empty">โหลดเมนูไม่สำเร็จ ลองรีเฟรชอีกครั้งนะคะ</div>'; return; }
      const s = DB.settings || {};
      store.set('ifrank_shop_theme', I.themeKey(s.theme));
      setTheme();
      document.title = s.shopName || 'iFrank';
      ['brand', 'footName', 'drawerBrand', 'ageBrand'].forEach((id) => { $(id).textContent = s.shopName || 'iFrank'; });
      $('tagline').textContent = s.tagline || '';
      $('service').innerHTML = s.serviceNote ? `<div class="service">${esc(s.serviceNote)}</div>` : '';
      $('about').textContent = s.aboutText || '';
      $('copyright').textContent = `© ${new Date().getFullYear()} ${s.shopName || 'iFrank'}`;
      renderAnnounce();
      if (s.ageGate !== false && !store.get('ifrank_age_ok', false)) $('age').classList.add('open');

      cleanCart();
      document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => go(t.dataset.tab)));
      $('searchInput').oninput = (e) => { query = e.target.value.trim().toLowerCase(); if (view !== 'shop') go('shop'); renderShop(); };
      window.addEventListener('hashchange', route);
      route();
      updateCart();
    }

    /* ================= ROUTER ================= */
    function go(v) { closeAll(); if (location.hash !== '#' + v) location.hash = v; else route(); }
    function route() {
      const v = (location.hash || '#shop').slice(1);
      view = ['shop', 'lab', 'orders', 'settings'].includes(v) ? v : 'shop';
      document.querySelectorAll('.view').forEach((el) => el.classList.toggle('hidden', el.id !== 'view-' + view));
      $('announce').classList.toggle('hidden', view === 'orders');
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === view));
      ({ shop: renderShop, lab: renderLab, orders: renderOrders, settings: renderSettings })[view]();
      window.scrollTo({ top: 0 });
      updateCart();
    }

    /* ================= HELPERS ================= */
    const product = (id) => DB.products.find((p) => p.id === id);
    const catOk = (p) => DB.categories.some((c) => c.id === p.category);
    const visible = () => DB.products.filter((p) => !p.hidden && catOk(p));
    const available = () => visible().filter((p) => !p.soldOut);
    const first = (e) => { try { return [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(e || '🌿')][0].segment; } catch (_) { return [...(e || '🌿')][0]; } };
    const cssVars = (p) => { const f = flavor(p.flavor); return `--c1:${f.c1};--c2:${f.c2};--ct:${onColor(f.c1)}`; };
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
    }
    function renderAnnounce() {
      const a = (DB.settings.announcement || '').trim();
      $('announce').innerHTML = a && store.get('ifrank_announce_closed', '') !== a
        ? `<div class="announce"><span class="age-pill">20+ ONLY</span><span class="txt">${esc(a)}</span><button onclick="closeAnnounce()" aria-label="ปิด">✕</button></div>` : '';
    }
    function closeAnnounce() { store.set('ifrank_announce_closed', DB.settings.announcement || ''); renderAnnounce(); }
    function toggleSearch() {
      const bar = $('searchbar');
      bar.classList.toggle('hidden');
      if (!bar.classList.contains('hidden')) { if (view !== 'shop') go('shop'); setTimeout(() => $('searchInput').focus(), 50); }
      else { query = ''; $('searchInput').value = ''; renderShop(); }
    }

    /* ================= SHOP ================= */
    function renderShop() {
      if (!DB) return;
      const cats = DB.categories.filter((c) => visible().some((p) => p.category === c.id));
      $('catChips').innerHTML = [`<button class="chip ${cat === 'all' ? 'on' : ''}" data-cat="all">✨ ทั้งหมด</button>`]
        .concat(cats.map((c) => `<button class="chip ${cat === c.id ? 'on' : ''}" data-cat="${esc(c.id)}">${esc(c.icon)} ${esc(c.name)}</button>`)).join('');
      $('catChips').onclick = (e) => { const b = e.target.closest('.chip'); if (b) { cat = b.dataset.cat; renderShop(); } };

      const t = terpFilter && TERPENES[terpFilter];
      $('filterbar').innerHTML = t ? `<div class="filterbar">${t.emoji}<span>เฉพาะสายพันธุ์ที่มี <b>${t.name}</b></span><button onclick="clearTerp()">✕ ล้าง</button></div>` : '';

      const match = (p) => {
        if (terpFilter && !(p.terpenes || []).some((x) => x.key === terpFilter)) return false;
        if (!query) return true;
        const terps = (p.terpenes || []).map((x) => TERPENES[x.key]?.name || '').join(' ');
        return [p.name, p.strain, p.lineage, p.terp, p.feel, terps].join(' ').toLowerCase().includes(query);
      };

      let html = '';
      for (const c of DB.categories.filter((c) => cat === 'all' || c.id === cat)) {
        const items = visible().filter((p) => p.category === c.id && match(p)).sort((a, b) => Number(a.soldOut) - Number(b.soldOut));
        if (!items.length) continue;
        const avail = items.filter((p) => !p.soldOut).length;
        html += `
          <section class="section">
            <div class="sec-head"><i class="sec-dot" style="background:${esc(c.color || 'var(--accent)')};box-shadow:0 0 10px ${esc(c.color || 'var(--accent)')}"></i>
              <span class="sec-name">${esc(c.icon)} ${esc(c.name)}</span><span class="sec-count">${avail}/${items.length} พร้อมขาย</span></div>
            ${c.subtitle ? `<div class="sec-sub">${esc(c.subtitle)}</div>` : ''}
            <div class="grid">${items.map(cardHTML).join('')}</div>
          </section>`;
      }
      $('shopList').innerHTML = html || `<div class="empty">ไม่พบสินค้าที่ตรงกับการค้นหา 🔍</div>`;
    }

    function cardHTML(p) {
      const tiers = p.prices || [];
      const ti = Math.min(selTier[p.id] || 0, tiers.length - 1);
      const tier = tiers[ti] || { price: 0, label: '' };
      const badges = p.soldOut ? ['<span class="badge sold-pill">หมดชั่วคราว</span>'] : (p.badges || []).slice(0, 2).map((b) => badgeHTML(b));
      return `
        <article class="card ${p.soldOut ? 'sold' : ''}" data-id="${esc(p.id)}" style="${cssVars(p)}">
          <div class="card-top ${badges.length === 2 ? 'two' : ''}">${badges.join('')}</div>
          <div class="emoji">${esc(p.emoji || '🌿')}</div>
          <h3 class="name">${esc(p.name)}</h3>
          <div class="type">${esc(p.strain || '')}</div>
          <div class="sizes">${tiers.map((t, i) => `<button class="size ${i === ti ? 'on' : ''}" data-size="${i}" ${p.soldOut ? 'disabled' : ''}>${esc(t.label)}</button>`).join('')}</div>
          <div class="price num">${tiers.length > 1 && p.soldOut ? 'เริ่ม ' : ''}${fmt(p.soldOut ? Math.min(...tiers.map((x) => x.price)) : tier.price)}<small>฿</small></div>
          <button class="add" data-add ${p.soldOut ? 'disabled' : ''}>${p.soldOut ? '🔒 สินค้าหมด' : '+ ใส่ตะกร้า'}</button>
        </article>`;
    }

    $('shopList').addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (!card) return;
      const p = product(card.dataset.id);
      const size = e.target.closest('[data-size]');
      if (size) { if (p.soldOut) return; selTier[p.id] = Number(size.dataset.size); card.outerHTML = cardHTML(p); return; }
      if (e.target.closest('[data-add]')) { if (!p.soldOut) addToCart(p.id, p.prices[selTier[p.id] || 0].label, 1); return; }
      openProduct(p.id);
    });

    function clearTerp() { terpFilter = null; renderShop(); }

    /* ================= PRODUCT SHEET ================= */
    function openProduct(id) {
      sheet = { id, tier: selTier[id] || 0, qty: 1 };
      renderProduct();
      open('productSheet');
    }
    function renderProduct() {
      const p = product(sheet.id);
      const tiers = p.prices || [];
      const tier = tiers[sheet.tier] || tiers[0];
      const row = (l, v, cls = 'v') => (v ? `<div class="row"><span class="l">${l}</span><span class="${cls}">${esc(v)}</span></div>` : '');
      const terps = (p.terpenes || []).filter((t) => TERPENES[t.key]);
      $('productBody').style.cssText = cssVars(p);
      $('productBody').innerHTML = `
        <div class="handle"></div>
        <div class="p-top">
          <div class="p-emoji">${esc(p.emoji || '🌿')}</div>
          <div style="min-width:0">
            <div class="p-name">${esc(p.name)}</div>
            <div class="p-type">${esc([p.strain, p.lineage].filter(Boolean).join(' · '))}</div>
            <div class="p-badges">${(p.badges || []).map((b) => badgeHTML(b)).join('')}</div>
          </div>
        </div>
        <div class="rule"></div>
        ${row('เทอร์ปีน', p.terp)}
        ${row('เอฟเฟกต์', p.effect)}
        ${row('ฟีล', p.feel, 'feel')}
        ${terps.length ? `<div class="opt">เทอร์ปีนหลัก</div><div class="terp-chips">${terps.map((t) => `<span class="tchip">${TERPENES[t.key].emoji} ${TERPENES[t.key].name} <b>${t.level}%</b></span>`).join('')}</div>` : ''}
        ${I.hasProfile(p) ? `<div class="mini-radar">${I.radarSVG(p.profile, { size: 130, labels: false, stroke: flavor(p.flavor).c1, id: 'pm' })}
          <ul>${Object.entries(PROFILE_AXES).map(([k, a]) => `<li><span>${a.emoji} ${a.label}</span><b>${'●'.repeat(Number(p.profile[k]) || 0)}${'○'.repeat(5 - (Number(p.profile[k]) || 0))}</b></li>`).join('')}</ul></div>` : ''}
        <div class="opt">เลือกขนาด</div>
        <div class="tiers">${tiers.map((t, i) => `<button class="tier ${i === sheet.tier ? 'on' : ''}" onclick="pickTier(${i})" ${p.soldOut ? 'disabled' : ''}><small>${esc(t.label)}</small><b class="num">${fmt(t.price)} ฿</b></button>`).join('')}</div>
        <div class="buy">
          <div class="stepper"><button onclick="stepQty(-1)" ${p.soldOut ? 'disabled' : ''}>−</button><span>${sheet.qty}</span><button onclick="stepQty(1)" ${p.soldOut ? 'disabled' : ''}>+</button></div>
          <button class="btn btn-main" onclick="addFromSheet()" ${p.soldOut ? 'disabled' : ''}>${p.soldOut ? 'สินค้าหมดชั่วคราว' : `ใส่ตะกร้า · ${fmt(tier.price * sheet.qty)} ฿`}</button>
        </div>`;
    }
    function pickTier(i) { sheet.tier = i; selTier[sheet.id] = i; renderProduct(); }
    function stepQty(d) { sheet.qty = Math.max(1, Math.min(99, sheet.qty + d)); renderProduct(); }
    function addFromSheet() {
      const p = product(sheet.id);
      addToCart(p.id, p.prices[sheet.tier].label, sheet.qty);
      closeAll();
      if (view === 'shop') renderShop();
    }

    /* ================= CART ================= */
    function addToCart(id, label, qty) {
      const p = product(id);
      if (!p || p.soldOut) return;
      const f = cart.find((c) => c.id === id && c.label === label);
      if (f) f.qty = Math.min(99, f.qty + qty); else cart.push({ id, label, qty });
      saveCart();
      toast(`เพิ่ม ${p.name} (${label}) แล้ว`);
      const c = $('topCount'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
    }
    function resolveCart() {
      return cart.map((c) => {
        const p = product(c.id);
        const t = p && (p.prices || []).find((x) => x.label === c.label);
        return p && t ? { ...c, p, price: Number(t.price), line: Number(t.price) * c.qty } : null;
      }).filter(Boolean);
    }
    function cleanCart() {
      const before = cart.length;
      cart = resolveCart().filter((r) => !r.p.hidden).map(({ id, label, qty }) => ({ id, label, qty }));
      if (before !== cart.length) saveCart();
    }
    function totals() {
      const rows = resolveCart().filter((r) => !r.p.soldOut);
      return { rows, count: rows.reduce((a, r) => a + r.qty, 0), total: rows.reduce((a, r) => a + r.line, 0) };
    }
    function saveCart() { store.set('ifrank_cart', cart); updateCart(); }
    function updateCart() {
      if (!DB) return;
      const { count, total } = totals();
      $('topCount').textContent = count;
      $('topCount').classList.toggle('hidden', !count);
      $('barCount').textContent = count;
      $('barTotal').textContent = `${fmt(total)} ฿`;
      $('cartbar').classList.toggle('show', count > 0 && view !== 'orders');
    }
    function openCart() { renderCart(); open('cartSheet'); }
    function renderCart() {
      const rows = resolveCart();
      const { total, count } = totals();
      if (!rows.length) { $('cartBody').innerHTML = '<div class="handle"></div><div class="empty">ตะกร้าว่างอยู่ — เลือกสายพันธุ์ที่ชอบได้เลย 🌿</div>'; return; }
      $('cartBody').innerHTML = `
        <div class="handle"></div>
        <div class="cart-head"><div class="h2">ตะกร้าของคุณ</div><button class="link" onclick="clearCart()">ล้างตะกร้า</button></div>
        ${rows.map((r, i) => `
          <div class="ci">
            <div class="ci-e">${esc(first(r.p.emoji))}</div>
            <div class="ci-m"><div class="ci-n">${esc(r.p.name)}</div><div class="ci-s">${esc(r.label)} · ${fmt(r.price)} ฿ ${r.p.soldOut ? '· <span class="so">หมดแล้ว</span>' : ''}</div></div>
            <div class="stepper"><button onclick="cartStep(${i},-1)">${r.qty === 1 ? '🗑' : '−'}</button><span>${r.qty}</span><button onclick="cartStep(${i},1)">+</button></div>
            <div class="ci-p num">${fmt(r.line)}</div>
          </div>`).join('')}
        <textarea class="note" id="orderNote" maxlength="300" placeholder="หมายเหตุถึงแอดมิน (ไม่บังคับ) เช่น ชื่อ / เวลาที่สะดวกรับของ">${esc(store.get('ifrank_note', ''))}</textarea>
        <div class="sum"><span>ยอดรวม ${count} ชิ้น</span><b class="num">${fmt(total)} ฿</b></div>
        ${DB.settings.orderNote ? `<div class="small">${esc(DB.settings.orderNote)}</div>` : ''}
        <button class="btn btn-main btn-block" style="margin-top:16px" id="confirmBtn" onclick="confirmOrder()" ${count ? '' : 'disabled'}>✅ ยืนยันออเดอร์</button>
        <div class="small" style="text-align:center;margin-top:8px">ยังไม่มีการตัดเงิน — ระบบจะออกใบสั่งซื้อให้แคปส่งในแชท</div>`;
      $('orderNote').oninput = (e) => store.set('ifrank_note', e.target.value);
    }
    function cartStep(i, d) {
      const r = resolveCart()[i];
      if (!r) return;
      const item = cart.find((c) => c.id === r.id && c.label === r.label);
      item.qty += d;
      if (item.qty <= 0) cart = cart.filter((c) => c !== item);
      saveCart(); renderCart();
      if (!cart.length) setTimeout(closeAll, 500);
    }
    function clearCart() { if (!confirm('ล้างสินค้าทั้งหมดในตะกร้า?')) return; cart = []; saveCart(); closeAll(); }

    /* ================= ORDER ================= */
    function localId() {
      const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Bangkok' }));
      return `IF-${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${Math.floor(1000 + Math.random() * 9000)}`;
    }
    async function confirmOrder() {
      const { rows, total, count } = totals();
      if (!count) return;
      const btn = $('confirmBtn'); btn.disabled = true; btn.textContent = 'กำลังออกใบสั่งซื้อ…';
      const note = (store.get('ifrank_note', '') || '').trim();
      let order = null, stored = false;
      try {
        const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: rows.map(({ id, label, qty }) => ({ id, label, qty })), note }) });
        const j = await r.json().catch(() => ({}));
        if (r.status === 400 || r.status === 429) { toast(j.error || 'สั่งซื้อไม่สำเร็จ'); btn.disabled = false; btn.textContent = '✅ ยืนยันออเดอร์'; return; }
        if (r.ok && j.order) { order = j.order; stored = !!j.stored; }
      } catch (_) { /* offline / no API → local slip */ }
      if (!order) {
        order = {
          id: localId(), createdAt: new Date().toISOString(), status: 'new', note, total, count,
          items: rows.map((r) => ({ id: r.id, name: r.p.name, emoji: r.p.emoji || '🌿', strain: r.p.strain || '', label: r.label, qty: r.qty, price: r.price, total: r.line })),
        };
      }
      order.stored = stored;
      orders = [order, ...orders.filter((o) => o.id !== order.id)].slice(0, 10);
      store.set('ifrank_orders', orders);
      currentOrderId = order.id;
      cart = []; saveCart(); store.del('ifrank_note');
      closeAll();
      go('orders');
      toast('ออกใบสั่งซื้อแล้ว — แคปหน้าจอส่งในแชทได้เลย 📸');
    }

    function barcodeHTML(id) {
      let h = 0; const out = [];
      for (let i = 0; i < 34; i++) { h = (h * 31 + id.charCodeAt(i % id.length) + i) >>> 0; out.push(`<i style="width:${(h % 3) + 1}px"></i>`); }
      return `<div class="barcode">${out.join('')}</div>`;
    }

    function renderOrders() {
      const v = $('view-orders');
      if (!orders.length) {
        v.innerHTML = `<div class="set-title"><div class="h2">ใบสั่งซื้อ</div></div><div class="empty">ยังไม่มีใบสั่งซื้อ<br><br><button class="btn btn-main" onclick="go('shop')">🏪 ไปเลือกสินค้า</button></div>`;
        return;
      }
      const o = orders.find((x) => x.id === currentOrderId) || orders[0];
      const s = DB.settings || {};
      v.innerHTML = `
        <div class="snap-hint">${esc(s.screenshotHint || 'แคปหน้าจอนี้ แล้วส่งในแชทที่คุยกับเราได้เลย')}</div>
        <div class="slip ${o.items.length > 4 ? 'compact' : ''}" id="slip">
          <div class="slip-stripe"></div>
          <div class="slip-in">
            <div class="slip-top"><span class="lab">🧪 ${esc((s.shopName || 'iFrank').toUpperCase())} · ORDER SLIP</span>
              <span class="status ${o.stored ? 'ok' : 'wait'}">● ${o.stored ? 'ส่งถึงร้านแล้ว' : 'รอส่งแคป'}</span></div>
            <div class="slip-title">ใบสั่งซื้อ</div>
            <div class="meta"><b class="id">#${esc(o.id)}</b><b>${esc(I.thaiDate(o.createdAt))}</b></div>
            <div class="lhead"><span>รายการ</span><span>จำนวน × ราคา</span></div>
            ${o.items.map((it) => `
              <div class="li"><div class="li-e">${esc(first(it.emoji))}</div>
                <div class="li-m"><div class="li-n">${esc(it.name)}</div><div class="li-t">${it.strain ? `<span>${esc(it.strain)}</span>` : ''}<span class="sz">${esc(it.label)}</span></div></div>
                <div class="li-p">${it.qty} × ฿${fmt(it.price)}</div></div>`).join('')}
            <div class="perf"></div>
            <div class="total-row"><div><small>ยอดรวมสุทธิ</small><b class="num">฿${fmt(o.total)}<span>THB</span></b></div><span class="count-pill">${o.count} ชิ้น</span></div>
            ${o.note ? `<div class="slip-note">📝 ${esc(o.note)}</div>` : ''}
            <div class="slip-foot"><div>${esc(location.host || 'ifrank.shop')}<br>20+ ONLY</div>${barcodeHTML(o.id)}</div>
          </div>
        </div>
        <div class="slip-actions stack">
          <button class="btn btn-mint btn-block" onclick="saveSlipImage()">💾 บันทึกรูปใบสั่งซื้อ</button>
          <button class="btn btn-ghost btn-block" onclick="copySlip()">📋 คัดลอกข้อความสรุปออเดอร์</button>
          <button class="btn btn-ghost btn-block" onclick="go('shop')">← กลับไปเลือกสินค้าเพิ่ม</button>
        </div>
        ${s.orderNote ? `<div class="small" style="margin:12px 16px 0;text-align:center">${esc(s.orderNote)}</div>` : ''}
        ${orders.length > 1 ? `
          <div class="h3row"><span class="h3">ประวัติใบสั่งซื้อ</span><small><button class="link" onclick="clearHistory()">ลบประวัติ</button></small></div>
          <div class="hist">${orders.map((x) => `<button class="h ${x.id === o.id ? 'on' : ''}" onclick="showOrder('${esc(x.id)}')"><div><b>#${esc(x.id)}</b><small>${esc(I.thaiDate(x.createdAt))} · ${x.count} ชิ้น</small></div><span class="amt num">฿${fmt(x.total)}</span></button>`).join('')}</div>` : ''}`;
    }
    function showOrder(id) { currentOrderId = id; renderOrders(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function clearHistory() { if (!confirm('ลบประวัติใบสั่งซื้อในเครื่องนี้?')) return; orders = []; store.set('ifrank_orders', []); renderOrders(); }

    function slipText(o) {
      return [
        `🧾 ใบสั่งซื้อ ${DB.settings.shopName || 'iFrank'}`,
        `#${o.id} · ${I.thaiDate(o.createdAt)}`,
        '━━━━━━━━━━━━',
        ...o.items.map((it) => `• ${it.name} (${it.label}) × ${it.qty} = ${fmt(it.total)}฿`),
        '━━━━━━━━━━━━',
        `💰 รวม ${fmt(o.total)}฿ (${o.count} ชิ้น)`,
        ...(o.note ? ['', `📝 ${o.note}`] : []),
      ].join('\n');
    }
    async function copySlip() {
      const o = orders.find((x) => x.id === currentOrderId) || orders[0];
      const text = slipText(o);
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {
        const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
      }
      toast(ok ? 'คัดลอกแล้ว — วางในแชทได้เลย ✓' : 'คัดลอกไม่สำเร็จ');
    }

    /* ----- slip → PNG (drawn by hand on canvas, no library) ----- */
    async function saveSlipImage() {
      const o = orders.find((x) => x.id === currentOrderId) || orders[0];
      try {
        await Promise.all(['800 40px Outfit', '600 30px Anuphan', '700 30px "Plus Jakarta Sans"', '600 26px "JetBrains Mono"'].map((f) => document.fonts.load(f, 'iFrank ใบสั่งซื้อ 0123')));
      } catch (_) {}
      const css = getComputedStyle(document.documentElement);
      const v = (n) => css.getPropertyValue('--' + n).trim();
      const C = { bg: v('bg'), card: v('card'), input: v('input'), line: v('line2'), text: v('text'), muted: v('muted'), dim: v('dim'), accent: v('accent'), mint: v('mint') || v('accent2'), amber: v('amber') || v('accent2') };
      const W = 1080, P = 64, rowH = 124;
      const H = 720 + o.items.length * rowH + (o.note ? 120 : 0) + 220;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const x = cv.getContext('2d');
      const F = (w, s, fam = "'Plus Jakarta Sans', Anuphan, sans-serif") => `${w} ${s}px ${fam}`;
      const D = (w, s) => F(w, s, "Outfit, Anuphan, sans-serif");
      const M = (w, s) => F(w, s, "'JetBrains Mono', monospace");
      const rr = (X, Y, w, h, r, fill, stroke) => { x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, r) : x.rect(X, Y, w, h); if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = 3; x.stroke(); } };
      const T = (t, X, Y, font, color, align = 'left') => { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(t, X, Y); };
      const fit = (t, font, max) => { x.font = font; let s = t; while (x.measureText(s).width > max && s.length > 1) s = s.slice(0, -1); return s === t ? t : s + '…'; };

      x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
      rr(32, 32, W - 64, H - 64, 48, C.card, C.line);
      const g = x.createLinearGradient(32, 0, W - 32, 0); g.addColorStop(0, C.accent); g.addColorStop(.5, C.mint); g.addColorStop(1, C.amber);
      x.save(); x.beginPath(); x.roundRect ? x.roundRect(32, 32, W - 64, 14, [48, 48, 0, 0]) : x.rect(32, 32, W - 64, 14); x.fillStyle = g; x.fill(); x.restore();

      let y = 130;
      T(`🧪 ${(DB.settings.shopName || 'iFrank').toUpperCase()} · ORDER SLIP`, P + 16, y, F(800, 26), C.mint);
      T(o.stored ? '● ส่งถึงร้านแล้ว' : '● รอส่งแคป', W - P - 16, y, M(600, 24), o.stored ? C.mint : C.amber, 'right');
      y += 78; T('ใบสั่งซื้อ', P + 16, y, D(800, 64), C.text);
      y += 40; rr(P + 16, y, W - 2 * P - 32, 132, 28, C.input);
      T('รหัสคำสั่งซื้อ', P + 48, y + 54, F(500, 26), C.muted); T('#' + o.id, W - P - 48, y + 54, M(600, 28), C.accent, 'right');
      T('วันที่', P + 48, y + 102, F(500, 26), C.muted); T(I.thaiDate(o.createdAt), W - P - 48, y + 102, M(600, 26), C.text, 'right');
      y += 190; T('รายการ', P + 20, y, F(700, 24), C.dim); T('จำนวน × ราคา', W - P - 20, y, F(700, 24), C.dim, 'right');
      y += 24;
      for (const it of o.items) {
        rr(P + 16, y, W - 2 * P - 32, rowH - 16, 26, C.input);
        T(first(it.emoji), P + 48, y + 72, F(400, 44, 'sans-serif'), C.text);
        T(fit(it.name, D(600, 34), 440), P + 150, y + 56, D(600, 34), C.text);
        T(`${it.strain ? it.strain + ' · ' : ''}${it.label}`, P + 150, y + 92, F(600, 22), C.muted);
        T(`${it.qty} × ฿${fmt(it.price)}`, W - P - 48, y + 68, M(600, 28), C.text, 'right');
        y += rowH;
      }
      y += 20; x.setLineDash([16, 12]); x.strokeStyle = C.line; x.lineWidth = 3; x.beginPath(); x.moveTo(P + 16, y); x.lineTo(W - P - 16, y); x.stroke(); x.setLineDash([]);
      y += 70; T('ยอดรวมสุทธิ', P + 20, y, F(700, 24), C.dim);
      y += 84; T(`฿${fmt(o.total)}`, P + 16, y, D(800, 92), C.text);
      T(`${o.count} ชิ้น`, W - P - 20, y - 16, F(700, 28), C.mint, 'right');
      if (o.note) { y += 40; rr(P + 16, y, W - 2 * P - 32, 84, 22, C.input); T(fit('📝 ' + o.note, F(500, 26), W - 2 * P - 100), P + 44, y + 52, F(500, 26), C.muted); y += 84; }
      y += 40; rr(P + 16, y, W - 2 * P - 32, 96, 26, null, C.accent);
      T(fit(DB.settings.screenshotHint || '📸 แคปหน้าจอนี้ แล้วส่งในแชทที่คุยกับเราได้เลย', F(700, 28), W - 2 * P - 90), W / 2, y + 60, F(700, 28), C.text, 'center');

      const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
      const file = new File([blob], `iFrank-${o.id}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: `ใบสั่งซื้อ #${o.id}` }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('บันทึกรูปแล้ว ✓');
    }

    /* ================= LAB ================= */
    function labData() {
      const pool = available().filter((p) => mood === 'all' || I.productMoods(p).includes(mood));
      const withProfile = pool.filter(I.hasProfile);
      const avg = {};
      Object.keys(PROFILE_AXES).forEach((k) => { avg[k] = withProfile.length ? withProfile.reduce((a, p) => a + (Number(p.profile[k]) || 0), 0) / withProfile.length : 0; });
      const terps = Object.entries(TERPENES).map(([key, t]) => {
        const has = pool.map((p) => ({ p, lv: (p.terpenes || []).find((x) => x.key === key)?.level })).filter((x) => x.lv);
        const level = has.length ? Math.round(has.reduce((a, x) => a + Number(x.lv), 0) / has.length) : 0;
        return { key, t, level, recs: has.sort((a, b) => b.lv - a.lv).map((x) => x.p), score: has.length * level };
      }).filter((x) => x.recs.length && (mood === 'all' || x.t.moods.includes(mood))).sort((a, b) => b.score - a.score);
      return { pool, withProfile, avg, terps };
    }

    function renderLab() {
      if (!DB) return;
      const { pool, withProfile, avg, terps } = labData();
      const allTerps = new Set(available().flatMap((p) => (p.terpenes || []).map((t) => t.key)));
      const topAxis = Object.entries(avg).sort((a, b) => b[1] - a[1])[0];
      $('view-lab').innerHTML = `
        <div class="lab-hero">
          <span class="live"><i></i>TERPENE GUIDE</span>
          <div class="lab-title">Terpene &amp; Flavor <em>Lab</em></div>
          <div class="lab-sub">ค้นหากลิ่นและอารมณ์ที่ใช่ จากสายพันธุ์ที่พร้อมขายตอนนี้</div>
          <div class="stats">
            <div class="stat"><div class="ic">🌿</div><b class="num">${available().length}</b><small>สายพันธุ์พร้อมขาย</small></div>
            <div class="stat"><div class="ic">🧪</div><b class="num">${allTerps.size}</b><small>เทอร์ปีนในเมนู</small></div>
            <div class="stat"><div class="ic">${topAxis && topAxis[1] ? PROFILE_AXES[topAxis[0]].emoji : '✨'}</div><b>${topAxis && topAxis[1] ? PROFILE_AXES[topAxis[0]].label : '—'}</b><small>กลิ่นเด่นตอนนี้</small></div>
          </div>
        </div>

        <div class="h3row"><span class="h3">🧠 เลือกอารมณ์ที่ต้องการ</span><small>แตะเพื่อกรอง</small></div>
        <div class="chips" style="padding-top:10px">${Object.entries(MOODS).map(([k, m]) => `<button class="chip ${mood === k ? 'on' : ''}" onclick="setMood('${k}')">${m.icon} ${m.label}</button>`).join('')}</div>

        <div class="panel">
          <div class="panel-head"><span class="h3">◎ Flavour Radar</span><span class="pill pill-mint">${mood === 'all' ? 'จากเมนูตอนนี้' : `${MOODS[mood].icon} ${MOODS[mood].label}`}</span></div>
          ${withProfile.length ? `<div class="radar-wrap">${I.radarSVG(avg, { size: 320, id: 'lab' })}</div><div class="radar-foot">ค่าเฉลี่ยจาก ${withProfile.length} สายพันธุ์</div>` : '<div class="empty" style="padding:30px">ยังไม่มีข้อมูลกลิ่นสำหรับตัวกรองนี้</div>'}
        </div>

        <div class="h3row"><span class="h3">เทอร์ปีนเด่นในเมนู</span><small>${terps.length} ชนิด</small></div>
        ${terps.length ? terps.map(({ key, t, level, recs }) => `
          <div class="tcard" style="--tc:${t.color}">
            <div class="tc-top">
              <div class="tc-ic">${t.emoji}</div>
              <div class="tc-main">
                <div class="tc-name">${t.name}<span class="tc-mood">${t.moods.map((m) => MOODS[m].icon + ' ' + MOODS[m].label).join(' · ')}</span></div>
                <div class="tc-aroma">กลิ่น${esc(t.aroma)}</div>
              </div>
              <div class="tc-pct"><b class="num">${level}%</b><small>ความเด่นเฉลี่ย</small></div>
            </div>
            <div class="bar"><i style="width:${level}%"></i></div>
            <div class="tc-desc">${esc(t.desc)}</div>
            <div class="tc-rec">สายพันธุ์แนะนำ:</div>
            <div class="tc-foot">
              <div class="terp-chips">${recs.slice(0, 4).map((p) => `<span class="tchip" onclick="openProduct('${esc(p.id)}')">${esc(p.emoji)} ${esc(p.name)}</span>`).join('')}</div>
              <button class="pick" onclick="pickTerp('${key}')">🛒 เลือกกลิ่นนี้</button>
            </div>
          </div>`).join('') : '<div class="empty">ไม่มีสายพันธุ์ที่พร้อมขายสำหรับอารมณ์นี้</div>'}

        <div class="info-card"><div class="ic">💡</div><div><b>Entourage Effect คืออะไร?</b><p>แนวคิดที่ว่าเทอร์ปีนและสารหลายตัวในดอกทำงานร่วมกัน ทำให้แต่ละสายพันธุ์ให้กลิ่นและฟีลต่างกัน แม้ค่า THC ใกล้เคียงกัน (ยังเป็นหัวข้อที่มีการศึกษาอยู่)</p></div></div>

        <div class="panel">
          <span class="pill pill-mint">Flavor pairing</span>
          <div class="h3" style="margin-top:10px">จับคู่กลิ่นให้เข้ากับช่วงเวลา</div>
          <div class="small" style="margin-top:4px">ลองเลือกสายพันธุ์ที่มีเทอร์ปีนเหล่านี้คู่กัน</div>
          <div class="combo">
            <div><div class="e">🍋 + 🌸</div><b>Fresh &amp; Soft</b><small>Limonene + Linalool · ซิตรัสตัดดอกไม้ ช่วงกลางวัน</small></div>
            <div><div class="e">🥭 + 🌶️</div><b>Deep &amp; Warm</b><small>Myrcene + Caryophyllene · ผลไม้สุกกับเครื่องเทศ ช่วงค่ำ</small></div>
          </div>
        </div>
        <div style="margin:14px 16px 0"><button class="btn btn-main btn-block" onclick="go('shop')">🏪 ไปเลือกสายพันธุ์ที่หน้าร้าน</button></div>`;
    }
    function setMood(k) { mood = k; renderLab(); }
    function pickTerp(key) { terpFilter = key; cat = 'all'; go('shop'); }

    /* ================= SETTINGS ================= */
    function renderSettings() {
      if (!DB) return;
      I.injectThemePreviewCSS();
      const mine = store.get('ifrank_my_theme', null);
      const shop = I.themeKey(DB.settings.theme);
      const cur = I.themeKey(activeTheme());
      $('view-settings').innerHTML = `
        <div class="set-title"><div class="h2">ตั้งค่า</div></div>
        <div class="panel">
          <div class="panel-head"><span class="h3">🎨 ธีมของฉัน</span>${mine ? `<button class="link" onclick="setMyTheme(null)">ใช้ธีมของร้าน</button>` : '<span class="pill pill-mint">ใช้ธีมของร้าน</span>'}</div>
          <div class="small" style="margin-top:4px">เปลี่ยนธีมได้เฉพาะในเครื่องคุณ ไม่กระทบคนอื่น</div>
          <div class="theme-grid">${Object.entries(THEMES).map(([k, t]) => `
            <button class="theme-opt ${k === cur ? 'on' : ''}" onclick="setMyTheme('${k}')">${I.themePreviewHTML(k)}
              <div class="nm">${esc(t.name)}${k === shop ? '<span>ร้านใช้</span>' : ''}</div></button>`).join('')}</div>
        </div>
        <div class="panel">
          <span class="h3">📸 วิธีสั่งซื้อ</span>
          <div class="steps">${howTo()}</div>
        </div>
        <div class="panel">
          <span class="h3">🔞 นโยบาย</span>
          <div class="small" style="margin-top:6px">จำหน่ายเฉพาะผู้มีอายุ 20 ปีบริบูรณ์ขึ้นไป · ห้ามจำหน่ายแก่สตรีมีครรภ์และสตรีให้นมบุตร</div>
        </div>
        <div class="panel">
          <span class="h3">🧹 ข้อมูลในเครื่อง</span>
          <div class="small" style="margin-top:6px">ตะกร้า ประวัติใบสั่งซื้อ และธีม เก็บไว้ในเครื่องนี้เท่านั้น</div>
          <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="clearLocal()">ล้างข้อมูลในเครื่อง</button>
        </div>`;
    }
    function howTo() {
      return [['เลือกสินค้า', 'เลือกสายพันธุ์และขนาด กด + ใส่ตะกร้า'], ['ยืนยันออเดอร์', 'เปิดตะกร้า ตรวจรายการ แล้วกดยืนยัน'], ['แคปส่งในแชท', 'แคปใบสั่งซื้อ (หรือกดบันทึกรูป) ส่งในแชทที่คุยกับเรา']]
        .map(([b, d], i) => `<div class="stp"><i>${i + 1}</i><div><b>${b}</b>${d}</div></div>`).join('');
    }
    function setMyTheme(k) {
      if (k && k !== I.themeKey(DB.settings.theme)) store.set('ifrank_my_theme', k); else store.del('ifrank_my_theme');
      setTheme(); renderSettings();
    }
    function clearLocal() {
      if (!confirm('ล้างตะกร้า ประวัติใบสั่งซื้อ และธีมในเครื่องนี้?')) return;
      ['ifrank_cart', 'ifrank_orders', 'ifrank_my_theme', 'ifrank_note'].forEach(store.del);
      cart = []; orders = []; currentOrderId = null;
      setTheme(); updateCart(); renderSettings(); toast('ล้างแล้ว ✓');
    }

    /* ================= INFO / SHEETS ================= */
    function openInfo(k) {
      const s = DB?.settings || {};
      const c = {
        order: ['📸 วิธีสั่งซื้อ', `<div class="steps">${howTo()}</div>${s.orderNote ? `<div class="small" style="margin-top:14px">${esc(s.orderNote)}</div>` : ''}`],
        delivery: ['🚚 การจัดส่ง', `<div class="small" style="font-size:13.5px">${esc(s.serviceNote || '')}<br><br>ค่าส่งและเวลาจัดส่ง แอดมินจะแจ้งในแชทหลังยืนยันออเดอร์</div>`],
        policy: ['🔞 นโยบาย 20+', '<div class="small" style="font-size:13.5px">จำหน่ายเฉพาะผู้มีอายุ 20 ปีบริบูรณ์ขึ้นไป<br>ห้ามจำหน่ายแก่สตรีมีครรภ์และสตรีให้นมบุตร<br>ร้านขอสงวนสิทธิ์ตรวจสอบอายุก่อนจัดส่ง</div>'],
      }[k];
      closeAll();
      $('infoBody').innerHTML = `<div class="handle"></div><div class="h2" style="margin-bottom:14px">${c[0]}</div>${c[1]}<button class="btn btn-ghost btn-block" style="margin-top:20px" onclick="closeAll()">ปิด</button>`;
      open('infoSheet');
    }
    function openDrawer() { open('drawer'); }
    function open(id) { $(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
    function bgClose(e) { if (e.target.classList.contains('overlay')) closeAll(); }
    function closeAll() { document.querySelectorAll('.overlay').forEach((o) => o.classList.remove('open')); document.body.style.overflow = ''; }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });

    function ageOk() { store.set('ifrank_age_ok', true); $('age').classList.remove('open'); }
    function ageNo() { document.querySelector('.age-q').textContent = 'ขออภัย เว็บไซต์นี้สำหรับผู้ที่อายุ 20 ปีขึ้นไปเท่านั้น'; $('ageBtns').remove(); }
  </script>
</body>
</html>
